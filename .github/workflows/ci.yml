name: CI Pipeline - Telco Churn Analysis

on: 
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Initial EDA Script
      run: python scripts/01_initial_eda.py > reports/eda_output.txt

    - name: Run Preprocessing and Feature Engineering Script
      run: python scripts/02_preprocessing_feature_engineering.py > reports/preprocessing_output.txt

    - name: Run Deep EDA and Visualizations Script
      run: python scripts/03_deep_eda_visualizations.py > reports/deep_eda_output.txt

    - name: Run Predictive Modeling Script
      run: python scripts/04_predictive_modeling.py > reports/predictive_modeling_output.txt

    - name: Run Model Evaluation and Interpretability Script
      run: python scripts/05_model_evaluation_interpretability.py > reports/model_evaluation_output.txt

    - name: Generate Jupyter Notebook
      run: python scripts/06_generate_notebook.py

    - name: Upload artifacts (reports, visualizations, notebook)
      uses: actions/upload-artifact@v4
      with:
        name: project-artifacts
        path: |
          reports/
          visualizations/
          notebooks/
